[project]
name = "ai-agent-platform-starter"
version = "0.1.0"
description = "FastAPI starter for building AI agent platforms"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true